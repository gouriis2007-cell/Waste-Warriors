<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waste Warriors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. WELCOME WINDOW -->
  <div id="welcome" class="overlay">
    <div class="card">
      <div class="logo">♻️</div>
      <h1>Welcome to Waste Warriors!</h1>
      <p>Catch the falling waste and drop it in the right bin.</p>
      <button id="play-btn" class="big">▶ Play</button>
    </div>
  </div>

  <!-- 2. STORY WINDOW (mother and child cartoon) -->
  <div id="story" class="overlay hidden">
    <div class="card">
      <div class="stage">
        <!-- Child: Appu -->
        <svg id="child" class="char" viewBox="0 0 100 130">
          <rect x="30" y="72" width="40" height="42" rx="12" fill="#42a5f5"/>
          <rect x="35" y="112" width="12" height="16" rx="4" fill="#5d4037"/>
          <rect x="53" y="112" width="12" height="16" rx="4" fill="#5d4037"/>
          <circle cx="50" cy="42" r="30" fill="#ffcc80"/>
          <path d="M20 40 Q50 -2 80 40 Q50 22 20 40Z" fill="#3e2723"/>
          <circle cx="40" cy="46" r="4" fill="#222"/>
          <circle cx="60" cy="46" r="4" fill="#222"/>
          <path d="M40 58 Q50 67 60 58" stroke="#c62828" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
        <!-- Mother: Amma -->
        <svg id="mother" class="char" viewBox="0 0 100 130">
          <path d="M28 72 L72 72 L84 126 L16 126Z" fill="#ec407a"/>
          <circle cx="50" cy="12" r="10" fill="#212121"/>
          <circle cx="50" cy="44" r="28" fill="#ffcc80"/>
          <path d="M21 46 Q21 12 50 12 Q79 12 79 46 Q70 24 50 24 Q30 24 21 46Z" fill="#212121"/>
          <circle cx="50" cy="31" r="2.5" fill="#c62828"/>
          <circle cx="40" cy="46" r="3.5" fill="#222"/>
          <circle cx="60" cy="46" r="3.5" fill="#222"/>
          <path d="M41 57 Q50 64 59 57" stroke="#c62828" stroke-width="3" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <div id="bubble">
        <b id="speaker"></b>
        <p id="line"></p>
      </div>
      <div class="row">
        <button id="skip-btn" class="link">Skip story</button>
        <button id="next-btn" class="big small">Next ➜</button>
      </div>
    </div>
  </div>

  <!-- 3. GAME SCREEN -->
  <div id="game" class="hidden">
    <div id="hud">
      <span>⭐ Score: <b id="score">0</b></span>
      <span>⚡ Level: <b id="level">1</b></span>
      <span id="hearts"></span>
    </div>

    <div id="lifelines">
      <b>Lifelines:</b>
      <button class="ll" id="ll-slow">⏳ Slow time</button>
      <button class="ll" id="ll-life">❤️ Extra life</button>
      <button class="ll" id="ll-hint">💡 Hint</button>
    </div>

    <div id="field">
      <div class="cloud c1">☁️</div>
      <div class="cloud c2">☁️</div>
      <div id="item"><span id="emoji"></span><small id="name"></small></div>
      <div id="grass"></div>
    </div>

    <p id="message"></p>
    <div id="bins"></div>
  </div>

  <!-- 4. GAME OVER WINDOW -->
  <div id="over" class="overlay hidden">
    <div class="card">
      <div class="logo">🏁</div>
      <h1>Game Over</h1>
      <p id="final"></p>
      <p id="rank" class="rank"></p>
      <button id="again-btn" class="big">↻ Play again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
